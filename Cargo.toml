[package]
name = "bacnet-republisher"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
description = "Native BACnet/IP discovery and MQTT republishing utility for NETIX"
license = "Apache-2.0"
repository = "https://github.com/NETIX-AI-OSS/bacnet-republisher"
readme = "README.md"
keywords = ["bacnet", "mqtt", "building-automation"]
categories = ["network-programming"]
default-run = "bacnet-republisher"

[dependencies]
anyhow = "1.0"
bacnet-client = "0.9.0"
bacnet-services = "0.9.0"
bacnet-transport = "0.9.0"
bacnet-types = "0.9.0"
bytes = "1.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossbeam-channel = "0.5"
directories = "6.0"
get_if_addrs = "0.5"
iced = { version = "0.14", features = ["fira-sans", "image", "tokio", "svg"] }
rumqttc = "0.25.1"
rustls-native-certs = "0.8"
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["rt-multi-thread", "time"] }
toml = "0.9"
tracing = "0.1"

[dev-dependencies]
bacnet-encoding = "0.9.0"
bacnet-network = "0.9.0"
tempfile = "3.23"

[build-dependencies]
winresource = "0.1"

# Vendored with a fix: broadcast destination port stays 47808 when the local
# bind port is ephemeral (port = 0). Upstream sends broadcasts to the local
# bind port, which breaks Who-Is discovery from an ephemeral-port client.
# See vendor/bacnet-transport/src/bip/mod.rs (broadcast_port).
[patch.crates-io]
bacnet-transport = { path = "vendor/bacnet-transport" }
